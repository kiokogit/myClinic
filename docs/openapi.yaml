components:
  schemas:
    Appointments:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date_created:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          nullable: true
          maxLength: 255
        last_modified:
          type: string
          format: date-time
          readOnly: true
        is_deleted:
          type: boolean
        date_deleted:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          nullable: true
          maxLength: 255
        start_time:
          type: string
          format: date-time
        duration_in_minutes:
          type: integer
        public_status:
          $ref: '#/components/schemas/PublicStatusEnum'
        patient:
          type: string
          format: uuid
        doctor:
          type: string
          format: uuid
      required:
      - date_created
      - doctor
      - id
      - last_modified
      - patient
      - start_time
    BlankEnum:
      enum:
      - ''
    GenderEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Rather Not say
    Login:
