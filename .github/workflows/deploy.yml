

name: Final Deploy CI

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  serve_docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate OpenAPI Document
        run: npx @scalar/cli document validate docs/openapi.yaml

      - name: Log in to Registry
        run: npx @scalar/cli auth login --token ${{ secrets.SCALAR_TOKEN }}

      - name: Push to Registry
        run: |
          npx @scalar/cli registry publish \
            --namespace default-team-vvlfo \
            --slug myclinic-api \
            --force \
            docs/openapi.yaml