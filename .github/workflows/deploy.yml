

name: Final Deploy CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t kiokogit12/savannah_tests:main .
          docker push kiokogit12/savannah_tests:main

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy
        env:
          VM_HOST: ${{ secrets.VM_HOST_PROD }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${VM_PASSWORD}" ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} "bash -s" << EOF
            cd backend_test_deploy
            chmod +x ./deploy.sh
            ./deploy.sh
          EOF
